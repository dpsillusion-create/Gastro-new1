<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartShift Swap – GastroEvolution Jobs</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">GastroEvolution <span>SmartShift Swap</span></div>
    <div id="userbox" class="userbox" hidden>
      <span id="restaurantName"></span>
      <button id="logout" class="link">Abmelden</button>
    </div>
  </header>

  <main>
    <div id="msg" class="msg" role="alert" hidden></div>

    <!-- Anmeldung / Registrierung -->
    <section id="auth" class="card narrow" hidden>
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Anmelden</button>
        <button id="tabRegister" class="tab" type="button">Betrieb registrieren</button>
      </div>

      <form id="loginForm" class="form">
        <label>E-Mail<input name="email" type="email" autocomplete="username" required></label>
        <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary">Anmelden</button>
      </form>

      <form id="registerForm" class="form" hidden>
        <p class="hint">Kurzfristig Personal finden: Schichten in Ihrem Umkreis (max. 25 km) an verifizierte Aushilfen ausschreiben.</p>
        <label>Name des Betriebs<input name="restaurantName" required minlength="2"></label>
        <label>Straße und Hausnummer<input name="street" autocomplete="street-address" required></label>
        <div class="row">
          <label>PLZ<input name="zip" inputmode="numeric" pattern="\d{5}" maxlength="5" autocomplete="postal-code" required></label>
          <label class="grow">Ort<input name="city" autocomplete="address-level2" required></label>
        </div>
        <label>Betriebsnummer (8 Ziffern)<input name="betriebsnummer" inputmode="numeric" pattern="\d{8}" maxlength="8" required>
          <small>Wird für die gesetzliche Sofortmeldung der Aushilfen benötigt.</small></label>
        <label>E-Mail<input name="email" type="email" autocomplete="username" required></label>
        <label>Passwort (mind. 10 Zeichen)<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="primary">Registrieren</button>
      </form>
    </section>

    <!-- Bereich für den Wirt -->
    <div id="dash" hidden>
      <section class="card">
        <h2>Schicht ausschreiben</h2>
        <form id="shiftForm" class="form grid">
          <label>Position
            <select name="role" required>
              <option>Barkeeper</option><option>Service</option><option>Servicekraft</option>
              <option>Koch</option><option>Küchenhilfe</option><option>Spüler</option>
            </select>
          </label>
          <label>Stundensatz (€/Std., mind. 13,90)
            <input name="rate" type="number" min="13.9" step="0.10" value="19" required>
          </label>
          <label>Beginn<input name="start" type="datetime-local" required></label>
          <label>Ende<input name="end" type="datetime-local" required></label>
          <label class="span">Anforderungen (optional)
            <input name="requirements" maxlength="500" placeholder="z. B. Erfahrung an der Cocktailbar erforderlich">
          </label>
          <label class="span">Tätigkeitsschlüssel (9 Ziffern, optional)
            <input name="activityKey" inputmode="numeric" pattern="\d{9}" maxlength="9" placeholder="z. B. laut Schlüsselverzeichnis der Bundesagentur für Arbeit">
            <small>Wird für die Sofortmeldung der Aushilfe benötigt. Ohne Angabe müssen Sie ihn bei der Meldung selbst ergänzen.</small>
          </label>
          <div class="span"><button class="primary">Schicht veröffentlichen</button></div>
        </form>
      </section>

      <section>
        <h2>Meine Schichten</h2>
        <div id="shifts" class="shifts"></div>
        <p id="empty" class="hint" hidden>Noch keine Schichten ausgeschrieben.</p>
      </section>
    </div>
  </main>

  <footer>© GastroEvolution · Impressum · Datenschutz</footer>
  <script src="app.js" defer></script>
</body>
</html>
